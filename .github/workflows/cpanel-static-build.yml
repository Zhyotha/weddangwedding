name: cPanel static build

on:
  push:
    branches:
      - master
      - migration/static-cpanel
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static SPA
        run: npm run build

      # Vite may omit dotfiles when copying public assets. Copy it explicitly,
      # then configure upload-artifact to retain hidden files.
      - name: Add Apache SPA fallback
        run: cp public/.htaccess dist/client/.htaccess

      - name: Upload cPanel-ready files
        uses: actions/upload-artifact@v4
        with:
          name: weddangwedding-cpanel
          path: dist/client/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
